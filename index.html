
<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordenem les síl·labes 3</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
    text-align: center;
}

h1 { font-size: 30px; }

.instruccions {
    font-size: 19px;
    margin-bottom: 25px;
}

.targetes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 25px;
    max-width: 1200px;
    margin: auto;
}

.targeta-contenidor {
    perspective: 1000px;
    height: 340px;
}

.targeta {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s;
    cursor: pointer;
}

.targeta.girada { transform: rotateY(180deg); }

.cara {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: white;
    border: 3px solid #333;
    border-radius: 15px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.darrere {
    transform: rotateY(180deg);
    justify-content: flex-start;
    padding-top: 18px;
}

.icona {
    font-size: 100px;
    line-height: 1.3;
    margin-bottom: 15px;
}

.text-girar {
    font-size: 18px;
    font-weight: bold;
}

.sillabes {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin: 12px 0;
    min-height: 48px;
}

.sillaba {
    background: #e5e5e5;
    border: 2px solid #333;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 21px;
    font-weight: bold;
    cursor: pointer;
}

.sillaba:disabled {
    opacity: 0.35;
    cursor: default;
}

.resposta {
    border: 2px dashed #333;
    border-radius: 8px;
    min-height: 42px;
    width: 90%;
    padding: 7px;
    font-size: 21px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 5px;
    margin: 5px 0;
    box-sizing: border-box;
}

.botons {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 10px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 10px 13px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.corregir { background: #a8d5a2; }
.reiniciar { background: #f4c6a6; }

.missatge {
    font-size: 17px;
    font-weight: bold;
    min-height: 22px;
    margin-top: 5px;
}

@media (max-width: 500px) {
    .targeta-contenidor { height: 350px; }
}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<h1>ORDENEM LES SÍL·LABES</h1>

<p class="instruccions">
GIRA LA TARGETA, ORDENA LES SÍL·LABES I FORMA LA PARAULA.
</p>

<div class="targetes" id="targetes"></div>
    <div style="margin: 30px auto;">
    <button id="descarregarPDF" class="corregir" style="font-size: 17px; padding: 14px 22px;">
        DESCARREGAR RESULTATS EN PDF
    </button>
</div>

<script>

const paraules = [

    // PROFESSIONS I OFICIS
    {nom:"BOM-BER", sillabes:["BOM","BER"], icona:"🚒"},
    {nom:"PA-LE-TA", sillabes:["PA","LE","TA"], icona:"👷"},
    {nom:"MET-GE", sillabes:["MET","GE"], icona:"🩺"},
    {nom:"CUI-NE-RA", sillabes:["CU","I","NE","RA"], icona:"👩‍🍳"},
    {nom:"PIN-TOR", sillabes:["PIN","TOR"], icona:"🖌️"},
    {nom:"PO-LI-CI-A", sillabes:["PO","LI","CI","A"], icona:"👮"},
    {nom:"CAR-TER", sillabes:["CAR","TER"], icona:"📮"},
    {nom:"DEN-TIS-TA", sillabes:["DEN","TIS","TA"], icona:"🦷"},

    // ALIMENTS
    {nom:"PA-E-LLA", sillabes:["PA", "E", "LLA"], icona:"🥘"},
    {nom:"MA-CAR-RONS", sillabes:["MA","CAR","RONS"], icona:"🍝"},
    {nom:"XO-CO-LA-TA", sillabes:["XO","CO","LA","TA"], icona:"🍫"},
    {nom:"GE-LAT", sillabes:["GE","LAT"], icona:"🍦"},
    {nom:"ME-LÓ", sillabes:["ME","LÓ"], icona:"🍈"},
    {nom:"PI-NYA", sillabes:["PI","NYA"], icona:"🍍"},
    {nom:"CI-RE-RA", sillabes:["CI","RE","RA"], icona:"🍒"},
    {nom:"PAS-TÍS", sillabes:["PAS","TÍS"], icona:"🧁"},

    // OBJECTES I MATERIALS
    {nom:"PA-RAI-GÜES", sillabes:["PA","RAI","GÜES"], icona:"☂️"},
    {nom:"RE-LLOT-GE", sillabes:["RE","LLOT","GE"], icona:"⌚"},
    {nom:"MA-LE-TA", sillabes:["MA","LE","TA"], icona:"🧳"},
    {nom:"LLAN-TER-NA", sillabes:["LLAN","TER","NA"], icona:"🔦"},
    {nom:"MI-RALL", sillabes:["MI","RALL"], icona:"🪞"},
    {nom:"ES-COM-BRA", sillabes:["ES","COM","BRA"], icona:"🧹"},
    {nom:"ES-PEL-MA", sillabes:["ES","PEL","MA"], icona:"🕯️"},

    // CIÈNCIA I TECNOLOGIA
    {nom:"MI-CROS-CO-PI", sillabes:["MI","CROS","CO","PI"], icona:"🔬"},
    {nom:"RO-BOT", sillabes:["RO","BOT"], icona:"🤖"},
    {nom:"SA-TÈL-LIT", sillabes:["SA","TÈL","LIT"], icona:"🛰️"},
    {nom:"CO-ET", sillabes:["CO","ET"], icona:"🚀"},
    {nom:"PI-LA", sillabes:["PI","LA"], icona:"🔋"},
    {nom:"CÀ-ME-RA", sillabes:["CÀ","ME","RA"], icona:"📷"},
    {nom:"MI-CRÒ-FON", sillabes:["MI","CRÒ","FON"], icona:"🎤"},
    {nom:"AU-RI-CU-LARS", sillabes:["AU","RI","CU","LARS"], icona:"🎧"},

    // MÚSICA I ART
    {nom:"FLAU-TA", sillabes:["FLAU","TA"], icona:"🪈"},
    {nom:"TROM-PE-TA", sillabes:["TROM","PE","TA"], icona:"🎺"},
    {nom:"SA-XÒ-FON", sillabes:["SA","XÒ","FON"], icona:"🎷"},
    {nom:"NO-TA", sillabes:["NO","TA"], icona:"🎵"},
    {nom:"PAR-TI-TU-RA", sillabes:["PAR","TI","TU","RA"], icona:"🎼"},
    {nom:"PA-LE-TA", sillabes:["PA","LE","TA"], icona:"🎨"},
    {nom:"TE-A-TRE", sillabes:["TE","A","TRE"], icona:"🎭"},
    {nom:"ES-CUL-TU-RA", sillabes:["ES","CUL","TU","RA"], icona:"🗿"}

];

const contenidor = document.getElementById("targetes");
    // REGISTRE DELS RESULTATS

const resultats = paraules.map(paraula => ({
    nom: paraula.nom.replace(/-/g, ""),
    resposta: "",
    estat: "PENDENT"
}));

function barrejar(array) {
    return [...array].sort(() => Math.random() - 0.5);
}

paraules.forEach((paraula, index) => {

    const contenidorTargeta = document.createElement("div");
    contenidorTargeta.className = "targeta-contenidor";

    const targeta = document.createElement("div");
    targeta.className = "targeta";

    const davant = document.createElement("div");
    davant.className = "cara";
    davant.innerHTML = `
        <div class="icona">${paraula.icona}</div>
        <div class="text-girar">GIRA LA TARGETA</div>
    `;

    const darrere = document.createElement("div");
    darrere.className = "cara darrere";

    const titol = document.createElement("div");
    titol.innerHTML = "<strong>ORDENA LES SÍL·LABES</strong>";

    const zonaSillabes = document.createElement("div");
    zonaSillabes.className = "sillabes";

    const zonaResposta = document.createElement("div");
    zonaResposta.className = "resposta";

    const botons = document.createElement("div");
    botons.className = "botons";

    const botoCorregir = document.createElement("button");
    botoCorregir.className = "corregir";
    botoCorregir.textContent = "CORREGIR";

    const botoReiniciar = document.createElement("button");
    botoReiniciar.className = "reiniciar";
    botoReiniciar.textContent = "TORNAR A COMENÇAR";

    const missatge = document.createElement("div");
    missatge.className = "missatge";

    botons.appendChild(botoCorregir);
    botons.appendChild(botoReiniciar);

    darrere.appendChild(titol);
    darrere.appendChild(zonaSillabes);
    darrere.appendChild(zonaResposta);
    darrere.appendChild(botons);
    darrere.appendChild(missatge);

    targeta.appendChild(davant);
    targeta.appendChild(darrere);

    contenidorTargeta.appendChild(targeta);
    contenidor.appendChild(contenidorTargeta);

    let resposta = [];

    function actualitzarResposta() {
        zonaResposta.innerHTML = "";

        resposta.forEach(sillaba => {
            const element = document.createElement("span");
            element.textContent = sillaba;
            zonaResposta.appendChild(element);
        });
    }

    function carregarSillabes() {
        resposta = [];
        zonaResposta.innerHTML = "";
        missatge.textContent = "";
        zonaSillabes.innerHTML = "";
    // REINICIEM EL RESULTAT DE LA TARGETA
    resultats[index].resposta = "";
    resultats[index].estat = "PENDENT";

        const sillabesBarrejades = barrejar(paraula.sillabes);

        sillabesBarrejades.forEach(sillaba => {
            const boto = document.createElement("button");
            boto.className = "sillaba";
            boto.textContent = sillaba;

            boto.addEventListener("click", () => {
                if (boto.disabled) return;

                resposta.push(sillaba);
                boto.disabled = true;
                actualitzarResposta();
            });

            zonaSillabes.appendChild(boto);
        });
    }

    botoCorregir.addEventListener("click", (event) => {
    event.stopPropagation();

    const respostaAlumne = resposta.join("-");
    const respostaCorrecta = paraula.sillabes.join("-");

    // GUARDEM LA RESPOSTA DE L'ALUMNE
    resultats[index].resposta = respostaAlumne;

    if (respostaAlumne === respostaCorrecta) {
        missatge.textContent = "MOLT BÉ! CORRECTE!";
        missatge.style.color = "green";

        resultats[index].estat = "CORRECTE";

    } else {
        missatge.textContent = "TORNA-HO A PROVAR!";
        missatge.style.color = "red";

        resultats[index].estat = "INCORRECTE";
    }
});

    botoReiniciar.addEventListener("click", (event) => {
        event.stopPropagation();
        carregarSillabes();
    });

    targeta.addEventListener("click", (event) => {
        if (event.target.closest("button")) return;
        targeta.classList.toggle("girada");
    });

    carregarSillabes();

});

// DESCARREGAR ELS RESULTATS EN PDF

document.getElementById("descarregarPDF").addEventListener("click", () => {

    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();

    // COMPTEM ELS RESULTATS
    const correctes = resultats.filter(r => r.estat === "CORRECTE").length;
    const incorrectes = resultats.filter(r => r.estat === "INCORRECTE").length;
    const pendents = resultats.filter(r => r.estat === "PENDENT").length;

    let y = 20;

    // TÍTOL
    doc.setFont("helvetica", "bold");
    doc.setFontSize(18);
    doc.text("RESULTATS DE L'ACTIVITAT", 15, y);

    y += 12;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(12);
    doc.text("Ordenem les síl·labes 3", 15, y);

    y += 10;

    doc.text("Data: " + new Date().toLocaleDateString("ca-ES"), 15, y);

    y += 10;

    doc.text("Nom de l'alumne/a: __________________________", 15, y);

    y += 15;

    // RESUM DELS RESULTATS
    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("RESUM DELS RESULTATS", 15, y);

    y += 10;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(11);

    doc.text("Respostes correctes: " + correctes, 15, y);
    y += 7;

    doc.text("Respostes incorrectes: " + incorrectes, 15, y);
    y += 7;

    doc.text("Activitats pendents: " + pendents, 15, y);

    y += 15;

    // RESULTATS DE CADA PARAULA
    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text("RESULTATS DE CADA PARAULA", 15, y);

    y += 10;

    resultats.forEach((r, index) => {

        // SI NO HI HA ESPAI, CREEM UNA PÀGINA NOVA
        if (y > 270) {
            doc.addPage();
            y = 20;
        }

        doc.setFont("helvetica", "bold");
        doc.setFontSize(11);

        doc.text((index + 1) + ". " + r.nom, 15, y);

        y += 7;

        doc.setFont("helvetica", "normal");
        doc.setFontSize(10);

        const resposta = r.resposta || "Sense resposta";

        doc.text("Resposta: " + resposta, 20, y);

        y += 6;

        doc.text("Resultat: " + r.estat, 20, y);

        y += 10;
    });

    // DESCARREGUEM EL DOCUMENT
    doc.save("resultats_ordenem_sillabes_3.pdf");

});
</script>

</body>
</html>
